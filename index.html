<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mindscape — a VisionQuest fan hub</title>
<meta name="description" content="Walk through Vision's mind: six rooms, six voices. An unofficial MCU fan project.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-room="vision">
<a class="skip" href="#room">Skip to room content</a>
<div class="loader" id="loader" aria-hidden="true"><div class="stone"></div><p class="loader-text">SYNCHRONISING CONSCIOUSNESS</p></div>
<div class="bg" aria-hidden="true">
  <div class="layer l1" data-depth="8"></div>
  <div class="layer l2" data-depth="18"></div>
  <div class="layer l3" data-depth="30"></div>
  <canvas id="particles"></canvas>
  <div class="scan"></div>
</div>
<header class="top">
  <a class="brand" href="#vision" aria-label="Mindscape home"><span class="gem" aria-hidden="true"></span><span>MINDSCAPE<small>VisionQuest hub</small></span></a>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="roomNav">Rooms</button>
  <nav id="roomNav" class="rooms" aria-label="Rooms of the mind"></nav>
</header>
<main id="room" tabindex="-1" aria-live="polite"></main>
<div class="transition" id="wipe" aria-hidden="true"></div>
<footer class="foot">
  <p>Fan project by Finley &amp; Landry · not affiliated with or endorsed by Marvel or Disney · no audio yet</p>
  <p class="keys">Keys: <kbd>1</kbd>–<kbd>6</kbd> rooms · <kbd>←</kbd>/<kbd>→</kbd> cycle</p>
</footer>
<script src="js/rooms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
